services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: investlink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/investlink
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/v1/}
    ports:
      - "3000:80"
    depends_on:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Processo separado de propósito: o gunicorn sobe três workers, e um
    # agendador dentro deles dispararia a mesma atualização três vezes,
    # concorrendo pela mesma tabela.
    entrypoint: ["python", "app/jobs/scheduler.py"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/investlink
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-America/Sao_Paulo}
      DAILY_REFRESH_HOUR: ${DAILY_REFRESH_HOUR:-21}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  data_science:
    build:
      context: ./data_science_pipeline
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/investlink
    volumes:
      - ./data_science_pipeline/models:/app/models
      - ./data_science_pipeline/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

volumes:
  postgres_data: